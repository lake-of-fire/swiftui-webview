name: Snapshot source publication and native verification
on:
  push:
    branches: [audit/snapshot-fencing-20260909]
    paths: [.github/workflows/snapshot-audit-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete tree and publish source-only child
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          export PRODUCT="$RUNNER_TEMP/product"
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, os
          encoded = pathlib.Path('.audit/snapshot.patch.b64').read_text()
          # Correct the recorded transport-only transcription; checksum remains mandatory.
          encoded = encoded.replace('GnJM8cyONco', 'GnJM8ONco')
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '94367ebad95dc865400408922e0427df11a4a00c0f9ebde60daba117d1f0a897'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'evidence', 'snapshot.patch').write_bytes(patch)
          PY
          git worktree add --detach "$PRODUCT" e1fb67b250e06f32a6b7ea82cbff71c1d4ca0d05
          cd "$PRODUCT"
          test "$(git rev-parse HEAD^{tree})" = 703607590fd8a2966c70b68856e6bd6472545613
          git apply --check "$RUNNER_TEMP/evidence/snapshot.patch"
          git apply --index "$RUNNER_TEMP/evidence/snapshot.patch"
          git diff --cached --check
          tree=$(git write-tree)
          test "$tree" = 3dace96adb27b91b975f65de8378ae6303a45e43
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'Fence snapshot results to capture geometry, binding and document generation' | git commit-tree "$tree" -p e1fb67b250e06f32a6b7ea82cbff71c1d4ca0d05)
          git push origin "$commit:refs/heads/fix/snapshot-result-fencing-20260909"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$commit" "$tree" > "$RUNNER_TEMP/evidence/identity.txt"
          git archive --format=tar "$commit" | gzip -n > "$RUNNER_TEMP/evidence/source.tar.gz"
          git ls-tree -r "$commit" > "$RUNNER_TEMP/evidence/tree.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-publication
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
  native:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compile package and run snapshot suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/identity.txt"
          test "$(git rev-parse HEAD^{tree})" = 3dace96adb27b91b975f65de8378ae6303a45e43
          swift --version | tee "$RUNNER_TEMP/evidence/swift.txt"
          swift test -j 4 --filter WebViewSnapshot 2>&1 | tee "$RUNNER_TEMP/evidence/tests.log"
          git diff --exit-code
      - name: Retain resolved dependency identities
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if test -f Package.resolved; then cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved"; fi
          git status --porcelain > "$RUNNER_TEMP/evidence/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-native
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
