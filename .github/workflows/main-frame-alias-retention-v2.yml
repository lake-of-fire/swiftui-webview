name: Main-frame alias retention qualification v2
on:
  push:
    branches: [audit/main-frame-alias-retention-20260909]
    paths: [.github/workflows/main-frame-alias-retention-v2.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c215fda231605a5e428f00f225dea2872d84d0c
          fetch-depth: 0
      - id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7c215fda231605a5e428f00f225dea2872d84d0c
          test "$(git rev-parse HEAD^{tree})" = 96352e74f4b9d81d2c1eba998f22fc6450b666c2
          test "$(git ls-remote origin refs/heads/fix/invalid-frame-retirement-20260909 | cut -f1)" = 7c215fda231605a5e428f00f225dea2872d84d0c
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('Sources/SwiftUIWebView/SwiftUIWebView.swift')
          text = p.read_text()
          old = """        if lastKnownMainFrame === registeredFrame {
              lastKnownMainFrame = nil
          }
          """.replace("          ", "")
          # The literal above is written with workflow indentation stripped by YAML;
          # use an explicit source spelling to avoid indentation ambiguity.
          old = "        if lastKnownMainFrame === registeredFrame {\n            lastKnownMainFrame = nil\n        }\n"
          new = "        if lastKnownMainFrame === registeredFrame {\n            // Removing one UUID alias must not discard the main-frame fallback\n            // while the exact same main handle remains registered elsewhere.\n            lastKnownMainFrame = multiTargetFrames.values.first(where: {\n                $0 === registeredFrame && $0.isMainFrame\n            })\n        }\n"
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          test_b64 = ''
          Path('Tests/SwiftUIWebViewTests/WebViewMainFrameAliasRetentionTests.swift').write_bytes(base64.b64decode(test_b64))
          PY
          git add Sources/SwiftUIWebView/SwiftUIWebView.swift Tests/SwiftUIWebViewTests/WebViewMainFrameAliasRetentionTests.swift
          git diff --cached --check
          test "$(git hash-object Tests/SwiftUIWebViewTests/WebViewMainFrameAliasRetentionTests.swift)" = fe06dd68ed312ade5e7d2424279c055f368a53f0
          swiftc -frontend -parse Sources/SwiftUIWebView/SwiftUIWebView.swift
          git config user.name 'OpenAI assistant'
          git config user.email noreply@openai.com
          git commit -m 'Preserve main-frame fallback while an alias remains'
          git push origin HEAD:refs/heads/fix/invalid-frame-retirement-20260909
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  baseline:
    needs: publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce on unchanged prior head
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SwiftUIWebViewTests/WebViewMainFrameAliasRetentionTests.swift "$RUNNER_TEMP/alias-tests.swift"
          git checkout --detach 7c215fda231605a5e428f00f225dea2872d84d0c
          cp "$RUNNER_TEMP/alias-tests.swift" Tests/SwiftUIWebViewTests/WebViewMainFrameAliasRetentionTests.swift
          set +e
          swift test -j 4 --filter WebViewMainFrameAliasRetentionTests > "$RUNNER_TEMP/baseline.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$code" -ne 0
          grep -q "Executed 3 tests" "$RUNNER_TEMP/baseline.log"
          grep -q "0 unexpected" "$RUNNER_TEMP/baseline.log"
          git diff --exit-code -- Sources Package.swift Package.resolved
  candidate:
    needs: publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Full exact-source suites
        shell: bash
        run: |
          set -euo pipefail
          swift test -j 4
          swift test -j 4 -c release
          ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address
          test -z "$(git status --porcelain --untracked-files=all)"
