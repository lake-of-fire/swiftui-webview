name: Frame identity source and native qualification
on:
  push:
    branches: [audit/frame-and-dispatch-20260909]
    paths: [.github/workflows/frame-identity-audit.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frame-evidence"
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib
          raw=gzip.decompress(base64.b64decode(pathlib.Path('audit/frame-identity.patch.gz.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='91002e6701e068bf519b4ceb19f9e658e038a9b3b8564d072958adc636790d75'
          pathlib.Path(os.environ['RUNNER_TEMP'],'frame-evidence','source.patch').write_bytes(raw)
          PY
          git checkout --detach aaaa02f44766896dfda9d6bb230d9a2b859cceed
          test "$(git rev-parse HEAD^{tree})" = aa1c2929598929f64a66644793f07be19fe8e983
          git apply --index --whitespace=error-all "$RUNNER_TEMP/frame-evidence/source.patch"
          test "$(git write-tree)" = 00e3e9c05bd85fd2f78a2a0d3dd5a7400a7acc39
          test "$(git diff --cached --name-only | wc -l)" = 2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve encoded frame URL identity and retire cleared main-frame fallback'
          git push origin HEAD:refs/heads/fix/frame-identity-routing-20260909
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/frame-evidence/identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/frame-evidence/tree.txt"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/frame-evidence/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: frame-identity-publication
          path: ${{ runner.temp }}/frame-evidence
          retention-days: 14
          if-no-files-found: error
  native:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [candidate, baseline]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          swift --version | tee "$RUNNER_TEMP/evidence/swift.txt"
          if [ "$VARIANT" = baseline ]; then
            cp Tests/SwiftUIWebViewTests/WebViewFrameIdentityTests.swift "$RUNNER_TEMP/FrameTests.swift"
            git checkout --detach aaaa02f44766896dfda9d6bb230d9a2b859cceed
            test "$(git rev-parse HEAD^{tree})" = aa1c2929598929f64a66644793f07be19fe8e983
            cp "$RUNNER_TEMP/FrameTests.swift" Tests/SwiftUIWebViewTests/WebViewFrameIdentityTests.swift
            git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
            set +e
            swift test -j 4 --filter WebViewFrameIdentityTests > "$RUNNER_TEMP/evidence/baseline.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "$RUNNER_TEMP/evidence/baseline-exit.txt"
            test "$rc" != 0
            grep -E 'Executed 8 tests, with [1-9][0-9]* failures \(0 unexpected\)' "$RUNNER_TEMP/evidence/baseline.log"
            git diff --exit-code
          else
            test "$(git rev-parse HEAD^{tree})" = 00e3e9c05bd85fd2f78a2a0d3dd5a7400a7acc39
            git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
            swift test -j 4 2>&1 | tee "$RUNNER_TEMP/evidence/full-debug.log"
            swift test -j 4 -c release 2>&1 | tee "$RUNNER_TEMP/evidence/full-release.log"
            ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address --filter 'WebViewFrameIdentityTests|WebViewSnapshot|WebViewCoercion' 2>&1 | tee "$RUNNER_TEMP/evidence/focused-asan.log"
            git diff --exit-code
            test -z "$(git ls-files --others --exclude-standard)"
          fi
      - if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved"
          git status --porcelain > "$RUNNER_TEMP/evidence/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-identity-${{ matrix.variant }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: error
