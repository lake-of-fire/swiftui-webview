name: Temporary webview convergence probe

on:
  push:
    branches:
      - codex/webview-convergence-probe-20260912

permissions:
  contents: write

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select qualified toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then sudo xcode-select -s /Applications/Xcode_26.3.app; fi
          swift --version
          xcodebuild -version

      - name: Preserve semantic composers
        run: |
          cp .github/scripts/compose-webview-convergence.py "$RUNNER_TEMP/compose-webview-convergence.py"
          cp .github/scripts/compose-webview-convergence-followup.py "$RUNNER_TEMP/compose-webview-convergence-followup.py"
          cp .github/scripts/guard-webview-debug-only-tests.py "$RUNNER_TEMP/guard-webview-debug-only-tests.py"

      - name: Compose exact histories and semantic runtime
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name convergence-bot
          git config user.email convergence-bot@example.invalid
          MAIN=fd2a7a2b44e7bc321d25778a01bc8f64d6e49193
          EPOCH=fe302bf8b7385d72778426ee20afad424ac80414

          git checkout -B codex/webview-convergence-candidate-20260912 "$MAIN"
          git merge --no-ff -Xours "$EPOCH" -m 'Merge qualified document-epoch stack into Reader webview lineage'

          git restore --source="$MAIN" -- \
            Sources/SwiftUIWebView/SwiftUIWebView.swift \
            SwiftUIWebView.xcodeproj/project.pbxproj \
            Tests/SwiftUIWebViewTests/WebViewNativeLookupHitTestStoreTests.swift

          python3 "$RUNNER_TEMP/compose-webview-convergence.py"
          python3 "$RUNNER_TEMP/compose-webview-convergence-followup.py"
          python3 "$RUNNER_TEMP/guard-webview-debug-only-tests.py"

          git add \
            Sources/SwiftUIWebView/SwiftUIWebView.swift \
            SwiftUIWebView.xcodeproj/project.pbxproj \
            Tests/SwiftUIWebViewTests/WebViewNativeLookupHitTestStoreTests.swift \
            Tests/SwiftUIWebViewTests/WebViewScriptCallerTests.swift
          git diff --cached --check
          git commit -m 'Semantically compose document epochs with Reader webview runtime'
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor "$EPOCH" HEAD
          test -z "$(git status --short)"

      - name: Debug tests
        shell: bash
        run: |
          set +e
          swift test > "$RUNNER_TEMP/webview-debug.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== Exact WebView debug failures ==="
            grep -n -E "Test Case .* failed|XCTAssert|error:|failed -|failure:" "$RUNNER_TEMP/webview-debug.log" | tail -n 120 || true
            echo "=== WebView debug test tail ==="
            tail -n 300 "$RUNNER_TEMP/webview-debug.log" || true
          fi
          exit "$status"

      - name: Release tests
        shell: bash
        run: |
          set +e
          swift test -c release > "$RUNNER_TEMP/webview-release.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== WebView release failures ==="
            grep -n -E "Test Case .* failed|error:|failed -|failure:" "$RUNNER_TEMP/webview-release.log" | tail -n 120 || true
            echo "=== WebView release tail ==="
            tail -n 300 "$RUNNER_TEMP/webview-release.log" || true
          fi
          exit "$status"

      - name: AddressSanitizer debug tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: swift test --sanitize=address

      - name: Publish candidate only after all tests pass
        shell: bash
        run: |
          set -euxo pipefail
          test -z "$(git status --short)"
          git push --force-with-lease origin HEAD:refs/heads/codex/webview-convergence-candidate-20260912
