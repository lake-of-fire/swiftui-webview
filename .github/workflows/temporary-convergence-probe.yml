name: Temporary webview convergence probe

on:
  push:
    branches:
      - codex/webview-convergence-probe-20260912

permissions:
  contents: write

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select qualified toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then sudo xcode-select -s /Applications/Xcode_26.3.app; fi
          swift --version
          xcodebuild -version
      - name: Compose exact histories
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name convergence-bot
          git config user.email convergence-bot@example.invalid
          git checkout -B codex/webview-convergence-candidate-20260912 fd2a7a2b44e7bc321d25778a01bc8f64d6e49193
          git merge --no-ff -Xours fe302bf8b7385d72778426ee20afad424ac80414 -m 'Merge qualified document-epoch stack into Reader webview lineage'
          git merge-base --is-ancestor fd2a7a2b44e7bc321d25778a01bc8f64d6e49193 HEAD
          git merge-base --is-ancestor fe302bf8b7385d72778426ee20afad424ac80414 HEAD
      - name: Debug tests
        run: swift test
      - name: Release tests
        run: swift test -c release
      - name: AddressSanitizer debug tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: swift test --sanitize=address
      - name: Publish candidate only after all tests pass
        shell: bash
        run: |
          set -euxo pipefail
          git status --short
          git push origin HEAD:refs/heads/codex/webview-convergence-candidate-20260912
