name: Temporary webview convergence probe

on:
  push:
    branches:
      - codex/webview-convergence-probe-20260912

permissions:
  contents: write

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select qualified toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then sudo xcode-select -s /Applications/Xcode_26.3.app; fi
          swift --version
          xcodebuild -version
      - name: Preserve semantic composer
        run: cp .github/scripts/compose-webview-convergence.py "$RUNNER_TEMP/compose-webview-convergence.py"
      - name: Compose exact histories and semantic runtime
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name convergence-bot
          git config user.email convergence-bot@example.invalid
          MAIN=fd2a7a2b44e7bc321d25778a01bc8f64d6e49193
          EPOCH=fe302bf8b7385d72778426ee20afad424ac80414
          git checkout -B codex/webview-convergence-candidate-20260912 "$MAIN"
          git merge --no-ff -Xours "$EPOCH" -m 'Merge qualified document-epoch stack into Reader webview lineage'

          git restore --source="$MAIN" -- \
            Sources/SwiftUIWebView/SwiftUIWebView.swift \
            SwiftUIWebView.xcodeproj/project.pbxproj \
            Tests/SwiftUIWebViewTests/WebViewNativeLookupHitTestStoreTests.swift
          python3 "$RUNNER_TEMP/compose-webview-convergence.py"

          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('Sources/SwiftUIWebView/SwiftUIWebView.swift')
          source = source_path.read_text()

          # Older epoch tests predate main's geometry provider. Production callers
          # stay explicit; test-only/internal callers may omit it.
          pattern = (
              r'(func installScriptCallerBinding\([\s\S]*?'
              r'snapshotCapture: WebViewScriptCaller\.SnapshotCapture\?,\s*\n\s*)'
              r'coordinateOriginInWindow: @escaping '
              r'WebViewScriptCaller\.CoordinateOriginInWindow'
          )
          replacement = (
              r'\1coordinateOriginInWindow: @escaping '
              r'WebViewScriptCaller.CoordinateOriginInWindow = { nil }'
          )
          source, count = re.subn(pattern, replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'geometry compatibility seam count={count}')

          # Document/binding generation is the cross-await transaction fence.
          # Frame registrations are validated independently by exact UUID+handle;
          # a global frame-generation fence incorrectly rejects legitimate
          # retire/replace operations inside an aggregate transaction.
          helper_pattern = r'''    private func evaluateBoundJavaScript\(\n.*?\n    \}\n\n(?=    private func validateJavaScriptOperation)'''
          helper_replacement = '''    private func evaluateBoundJavaScript(
              _ caller: AsyncCaller,
              _ token: JavaScriptBindingToken,
              _ script: String,
              _ arguments: [String: any Sendable]?,
              _ frame: WKFrameInfo?,
              _ world: WKContentWorld?,
              expectedFrameContextGeneration _: UInt64
          ) async throws -> JavaScriptEvaluationResult {
              try validateJavaScriptOperation(token)
              let result: JavaScriptEvaluationResult
              do {
                  result = try await caller(script, arguments, frame, world)
              } catch {
                  try validateJavaScriptOperation(token)
                  let nsError = error as NSError
                  if let frame,
                     nsError.domain == WKError.errorDomain,
                     nsError.code == WKError.javaScriptInvalidFrameTarget.rawValue {
                      removeRegisteredFrame(frame)
                  }
                  throw error
              }
              try validateJavaScriptOperation(token)
              return result
          }

'''
          source, count = re.subn(helper_pattern, helper_replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'evaluateBoundJavaScript replacement count={count}')

          # The duplicate fanout iterates a frozen snapshot. An invalid dispatch may
          # retire every UUID alias for a frame, so never dispatch a later stale alias.
          duplicate_old = '''            for (uuid, targetFrame) in evaluationContext.childFrames {
                try requireCurrentFrameContext(evaluationContext.frameContextGeneration)
                try requireContinuation()
                do {
'''
          # The first such loop belongs to aggregate after composition on some main
          # revisions, so patch the single-evaluation loop by its form without
          # requireContinuation as well.
          single_old = '''            for (uuid, targetFrame) in evaluationContext.childFrames {
                try requireCurrentFrameContext(evaluationContext.frameContextGeneration)
                do {
'''
          single_new = '''            for (uuid, targetFrame) in evaluationContext.childFrames {
                try requireCurrentFrameContext(evaluationContext.frameContextGeneration)
                guard multiTargetFrames[uuid] === targetFrame else { continue }
                do {
'''
          if source.count(single_old) != 1:
              raise SystemExit(f'duplicate fanout loop count={source.count(single_old)}')
          source = source.replace(single_old, single_new, 1)

          aggregate_pattern = r'''    public func evaluateJavaScriptInMultiTargetFrames\(\n.*?\n    \}\n\n(?=    @MainActor\n    public func captureSnapshot\(rect:)'''
          aggregate_replacement = '''    public func evaluateJavaScriptInMultiTargetFrames(
              _ js: String,
              arguments: [String: any Sendable]? = nil,
              in world: WKContentWorld? = nil,
              propagatesFrameErrors: Bool = false,
              continueWhile shouldContinue: (@MainActor () -> Bool)? = nil,
              stopAfterResult shouldStopAfterResult: (@MainActor (Any?) -> Bool)? = nil
          ) async throws -> [Any?] {
              guard let evaluationContext = makeJavaScriptEvaluationContext(
                  includeChildFrames: true
              ) else {
                  reportUnboundEvaluation(
                      operation: .evaluateJavaScriptInMultiTargetFrames,
                      script: js
                  )
                  throw ScriptCallerError.evaluationTimedOut
              }
              let asyncCaller = evaluationContext.asyncCaller
              let bindingToken = evaluationContext.bindingToken
              let primitiveArguments: [String: any Sendable]? = arguments?.mapValues {
                  if let set = $0 as? Set<AnyHashable> {
                      return Array(set) as! any Sendable
                  }
                  return $0
              }

              func requireContinuation() throws {
                  try validateJavaScriptOperation(bindingToken)
                  guard shouldContinue?() != false else {
                      throw CancellationError()
                  }
              }

              try requireContinuation()
              let mainResult = try await evaluateBoundJavaScript(
                  asyncCaller,
                  bindingToken,
                  js,
                  primitiveArguments,
                  nil,
                  world,
                  expectedFrameContextGeneration: evaluationContext.frameContextGeneration
              ).value
              try requireContinuation()
              let normalizedMainResult = normalizeJavaScriptResult(mainResult)
              var frameResults: [(uuid: String, frame: WKFrameInfo, value: Any?)] = []

              func finalizedResults() throws -> [Any?] {
                  try requireContinuation()
                  var finalized = [normalizedMainResult]
                  for entry in frameResults {
                      guard multiTargetFrames[entry.uuid] === entry.frame else {
                          if propagatesFrameErrors { throw CancellationError() }
                          continue
                      }
                      finalized.append(entry.value)
                  }
                  return finalized
              }

              if shouldStopAfterResult?(normalizedMainResult) == true {
                  return try finalizedResults()
              }

              for (uuid, targetFrame) in evaluationContext.childFrames {
                  try requireContinuation()
                  guard multiTargetFrames[uuid] === targetFrame else {
                      if propagatesFrameErrors { throw CancellationError() }
                      continue
                  }
                  do {
                      let result = try await evaluateBoundJavaScript(
                          asyncCaller,
                          bindingToken,
                          js,
                          primitiveArguments,
                          targetFrame,
                          world,
                          expectedFrameContextGeneration: evaluationContext.frameContextGeneration
                      ).value
                      try requireContinuation()
                      guard multiTargetFrames[uuid] === targetFrame else {
                          if propagatesFrameErrors { throw CancellationError() }
                          continue
                      }
                      let normalizedResult = normalizeJavaScriptResult(result)
                      frameResults.append((uuid, targetFrame, normalizedResult))
                      if shouldStopAfterResult?(normalizedResult) == true {
                          return try finalizedResults()
                      }
                  } catch {
                      if error is CancellationError { throw error }
                      if propagatesFrameErrors { throw error }
                  }
              }

              return try finalizedResults()
          }

'''
          source, count = re.subn(aggregate_pattern, aggregate_replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'aggregate evaluator replacement count={count}')

          source_path.write_text(source)

          # Multiple runtime UUIDs may deliberately alias one WKFrameInfo. Update
          # the two main-line assertions that encoded the older alias-collapsing rule.
          tests_path = Path('Tests/SwiftUIWebViewTests/WebViewScriptCallerTests.swift')
          tests = tests_path.read_text()
          old_one = '''        XCTAssertNil(caller.exactFrame(
              forUUID: "old-runtime-frame",
              documentURL: documentURL
          ))
'''
          new_one = '''        XCTAssertTrue(caller.exactFrame(
              forUUID: "old-runtime-frame",
              documentURL: documentURL
          ) === frame)
'''
          old_two = '''        XCTAssertNil(caller.exactFrame(
              forUUID: "replacement-runtime-frame",
              documentURL: documentURL
          ))
'''
          new_two = '''        XCTAssertTrue(caller.exactFrame(
              forUUID: "replacement-runtime-frame",
              documentURL: documentURL
          ) === replacementFrame)
'''
          if tests.count(old_one) != 1 or tests.count(old_two) != 1:
              raise SystemExit(
                  f'alias assertion preimages old={tests.count(old_one)} replacement={tests.count(old_two)}'
              )
          tests = tests.replace(old_one, new_one, 1).replace(old_two, new_two, 1)
          tests_path.write_text(tests)
          PY

          git add Sources/SwiftUIWebView/SwiftUIWebView.swift \
            SwiftUIWebView.xcodeproj/project.pbxproj \
            Tests/SwiftUIWebViewTests/WebViewNativeLookupHitTestStoreTests.swift \
            Tests/SwiftUIWebViewTests/WebViewScriptCallerTests.swift
          git diff --cached --check
          git commit -m 'Semantically compose document epochs with Reader webview runtime'
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor "$EPOCH" HEAD
          git status --short
      - name: Debug tests
        shell: bash
        run: |
          set +e
          swift test > "$RUNNER_TEMP/webview-debug.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== failing WebView debug tests ==="
            grep -E "Test Case .* failed|XCTAssert|error:|failed \(|failure:" "$RUNNER_TEMP/webview-debug.log" | tail -n 160 || true
          fi
          exit "$status"
      - name: Release tests
        run: swift test -c release
      - name: AddressSanitizer debug tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: swift test --sanitize=address
      - name: Publish candidate only after all tests pass
        shell: bash
        run: |
          set -euxo pipefail
          git status --short
          git push --force-with-lease origin HEAD:refs/heads/codex/webview-convergence-candidate-20260912
