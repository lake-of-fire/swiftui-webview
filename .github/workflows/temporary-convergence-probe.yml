name: Temporary webview convergence probe

on:
  push:
    branches:
      - codex/webview-convergence-probe-20260912

permissions:
  contents: write

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select qualified toolchain
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then sudo xcode-select -s /Applications/Xcode_26.3.app; fi
          swift --version
          xcodebuild -version
      - name: Preserve semantic composer
        run: cp .github/scripts/compose-webview-convergence.py "$RUNNER_TEMP/compose-webview-convergence.py"
      - name: Compose exact histories and semantic runtime
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name convergence-bot
          git config user.email convergence-bot@example.invalid
          MAIN=fd2a7a2b44e7bc321d25778a01bc8f64d6e49193
          EPOCH=fe302bf8b7385d72778426ee20afad424ac80414
          git checkout -B codex/webview-convergence-candidate-20260912 "$MAIN"
          git merge --no-ff -Xours "$EPOCH" -m 'Merge qualified document-epoch stack into Reader webview lineage'

          # Current main remains authoritative for the evolved Reader runtime layout,
          # Xcode project, and native-lookup suite. Reapply document-epoch semantics
          # deliberately rather than accepting conflict-strategy source fragments.
          git restore --source="$MAIN" -- \
            Sources/SwiftUIWebView/SwiftUIWebView.swift \
            SwiftUIWebView.xcodeproj/project.pbxproj \
            Tests/SwiftUIWebViewTests/WebViewNativeLookupHitTestStoreTests.swift
          python3 "$RUNNER_TEMP/compose-webview-convergence.py"

          # The older document-epoch focused tests predate main's optional geometry
          # binding callback. Keep main callers explicit while allowing those focused
          # tests to omit geometry; nil means no mounted-window coordinate origin.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/SwiftUIWebView/SwiftUIWebView.swift')
          source = path.read_text()
          old = '''        snapshotCapture: WebViewScriptCaller.SnapshotCapture?,
              coordinateOriginInWindow: @escaping WebViewScriptCaller.CoordinateOriginInWindow
          ) {'''
          new = '''        snapshotCapture: WebViewScriptCaller.SnapshotCapture?,
              coordinateOriginInWindow: @escaping WebViewScriptCaller.CoordinateOriginInWindow = { nil }
          ) {'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one coordinator binding compatibility seam, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

          git add Sources/SwiftUIWebView/SwiftUIWebView.swift \
            SwiftUIWebView.xcodeproj/project.pbxproj \
            Tests/SwiftUIWebViewTests/WebViewNativeLookupHitTestStoreTests.swift
          git diff --cached --check
          git commit -m 'Semantically compose document epochs with Reader webview runtime'
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor "$EPOCH" HEAD
          git status --short
      - name: Debug tests
        run: swift test
      - name: Release tests
        run: swift test -c release
      - name: AddressSanitizer debug tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: swift test --sanitize=address
      - name: Publish candidate only after all tests pass
        shell: bash
        run: |
          set -euxo pipefail
          git status --short
          git push --force-with-lease origin HEAD:refs/heads/codex/webview-convergence-candidate-20260912
