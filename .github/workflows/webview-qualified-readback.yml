name: WebView exact final readback
on:
  push:
    branches: [audit/snapshot-fencing-20260909]
    paths: [.github/workflows/webview-qualified-readback.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate, baseline]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aaaa02f44766896dfda9d6bb230d9a2b859cceed
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Full native qualification and independent baseline failure
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = aaaa02f44766896dfda9d6bb230d9a2b859cceed
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
          test "$(git rev-parse HEAD:Tests/SwiftUIWebViewTests/WebViewCoercionErrorTests.swift)" = fd398cddd2cc861fcc7ad34e2a0e38dcd49c0a5e
          swift --version > "$RUNNER_TEMP/evidence/swift.txt"
          if test "$MODE" = baseline; then
            cp Tests/SwiftUIWebViewTests/WebViewCoercionErrorTests.swift "$RUNNER_TEMP/tests.swift"
            git checkout --detach e1fb67b250e06f32a6b7ea82cbff71c1d4ca0d05
            cp "$RUNNER_TEMP/tests.swift" Tests/SwiftUIWebViewTests/WebViewCoercionErrorTests.swift
            git diff --exit-code
            git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/baseline-identity.txt"
            set +e
            swift test -j 4 --filter WebViewCoercionErrorTests 2>&1 | tee "$RUNNER_TEMP/evidence/baseline.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "$RUNNER_TEMP/evidence/exit-code.txt"
            test "$code" -ne 0
            grep -E 'Executed 9 tests, with [1-9][0-9]* failures' "$RUNNER_TEMP/evidence/baseline.log"
          else
            git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/evidence/source.tar.gz"
            git ls-tree -r HEAD > "$RUNNER_TEMP/evidence/tree.txt"
            git diff --binary --full-index d234c6a2ec94733d5da79f171cf12028016350ee HEAD > "$RUNNER_TEMP/evidence/coercion.patch"
            swift test -j 4 2>&1 | tee "$RUNNER_TEMP/evidence/full-debug.log"
            swift test -j 4 -c release 2>&1 | tee "$RUNNER_TEMP/evidence/full-release.log"
            ASAN_OPTIONS=detect_leaks=0 swift test -j 4 --sanitize address --filter 'WebViewSnapshot|WebViewCoercion' 2>&1 | tee "$RUNNER_TEMP/evidence/focused-asan.log"
            git diff --exit-code
          fi
      - if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if test -f Package.resolved; then cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved"; fi
          git status --porcelain > "$RUNNER_TEMP/evidence/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview-qualified-${{ matrix.mode }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
