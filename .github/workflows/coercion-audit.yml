name: JavaScript coercion error qualification
on:
  push:
    branches: [audit/snapshot-fencing-20260909]
    paths: [.github/workflows/coercion-audit.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: publish
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.audit/WebViewCoercionErrorTests.swift" > "$RUNNER_TEMP/tests.swift"
          git worktree add --detach "$RUNNER_TEMP/product" e1fb67b250e06f32a6b7ea82cbff71c1d4ca0d05
          cd "$RUNNER_TEMP/product"
          test "$(git rev-parse HEAD^{tree})" = 703607590fd8a2966c70b68856e6bd6472545613
          cp "$RUNNER_TEMP/tests.swift" Tests/SwiftUIWebViewTests/WebViewCoercionErrorTests.swift
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/SwiftUIWebView/SwiftUIWebView.swift');s=p.read_text()
          a='                if !handled {\n                    // Treat unsupported result types as a benign nil so DOM snapshot can continue.'
          b='                if !handled,\n                   nsError.domain == WKError.errorDomain,\n                   nsError.code == WKError.javaScriptResultTypeIsUnsupported.rawValue {\n                    // A coercion retry may fail for a different reason. Never\n                    // turn cancellation or a real retry failure into success.\n                    // Treat unsupported result types as a benign nil so DOM snapshot can continue.'
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          PY
          git add Sources/SwiftUIWebView/SwiftUIWebView.swift Tests/SwiftUIWebViewTests/WebViewCoercionErrorTests.swift
          git diff --cached --check
          tree=$(git write-tree)
          test "$tree" = 87dca79aa1588e372c4a4069e4162f6f4942e257
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'Preserve cancellation and failures from JavaScript coercion retries' | git commit-tree "$tree" -p e1fb67b250e06f32a6b7ea82cbff71c1d4ca0d05)
          git push origin "$commit:refs/heads/fix/javascript-coercion-errors-20260909"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
  native:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate, baseline]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify exact source and native behavior
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/candidate-identity.txt"
          test "$(git rev-parse HEAD^{tree})" = 87dca79aa1588e372c4a4069e4162f6f4942e257
          swift --version > "$RUNNER_TEMP/evidence/swift.txt"
          if test "$MODE" = baseline; then
            cp Tests/SwiftUIWebViewTests/WebViewCoercionErrorTests.swift "$RUNNER_TEMP/tests.swift"
            git checkout --detach e1fb67b250e06f32a6b7ea82cbff71c1d4ca0d05
            cp "$RUNNER_TEMP/tests.swift" Tests/SwiftUIWebViewTests/WebViewCoercionErrorTests.swift
            git diff --exit-code
            git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/baseline-identity.txt"
            set +e
            swift test -j 4 --filter WebViewCoercionErrorTests 2>&1 | tee "$RUNNER_TEMP/evidence/baseline.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "$RUNNER_TEMP/evidence/exit-code.txt"
            test "$code" -ne 0
            grep -E 'Executed 9 tests, with [1-9][0-9]* failures' "$RUNNER_TEMP/evidence/baseline.log"
          else
            swift test -j 4 --filter WebViewCoercionErrorTests 2>&1 | tee "$RUNNER_TEMP/evidence/focused-debug.log"
            swift test -j 4 -c release --filter WebViewCoercionErrorTests 2>&1 | tee "$RUNNER_TEMP/evidence/focused-release.log"
            swift test -j 4 2>&1 | tee "$RUNNER_TEMP/evidence/full-debug.log"
            git diff --exit-code
          fi
      - if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if test -f Package.resolved; then cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved"; fi
          git status --porcelain > "$RUNNER_TEMP/evidence/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coercion-${{ matrix.mode }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
