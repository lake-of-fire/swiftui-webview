name: Snapshot final source recheck
on:
  push:
    branches: [audit/snapshot-fencing-20260909]
    paths: [.github/workflows/snapshot-audit-recheck.yml]
permissions:
  contents: read
jobs:
  publish-test-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.fix.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6e3e5b5de5745d13697e960f5b7c5fc62bece3b
          fetch-depth: 0
      - id: fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 3dace96adb27b91b975f65de8378ae6303a45e43
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/SwiftUIWebViewTests/WebViewSnapshotFencingTests.swift')
          s = p.read_text()
          old = 'private func bindingChange(_ change: (WebViewScriptCaller, WebViewScriptCaller.SnapshotCapture) -> Void)'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old.replace(', WebViewScriptCaller.SnapshotCapture', ', @escaping WebViewScriptCaller.SnapshotCapture')))
          PY
          git add Tests/SwiftUIWebViewTests/WebViewSnapshotFencingTests.swift
          git diff --cached --check
          tree=$(git write-tree)
          test "$tree" = 2032bae2d7b6d88c75653824bb8be472d62ca3ef
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'Declare escaping snapshot callback in ABA regression helper' | git commit-tree "$tree" -p a6e3e5b5de5745d13697e960f5b7c5fc62bece3b)
          git push origin "$commit:refs/heads/fix/snapshot-result-fencing-20260909"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
  candidate:
    needs: publish-test-fix
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-test-fix.outputs.commit }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/identity.txt"
          test "$(git rev-parse HEAD^{tree})" = 2032bae2d7b6d88c75653824bb8be472d62ca3ef
          swift --version | tee "$RUNNER_TEMP/evidence/swift.txt"
          swift test -j 4 --filter WebViewSnapshot 2>&1 | tee "$RUNNER_TEMP/evidence/snapshots.log"
          swift test -j 4 2>&1 | tee "$RUNNER_TEMP/evidence/full-debug.log"
          swift test -j 4 -c release --filter WebViewSnapshot 2>&1 | tee "$RUNNER_TEMP/evidence/snapshots-release.log"
          git diff --exit-code
      - if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if test -f Package.resolved; then cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved"; fi
          git status --porcelain > "$RUNNER_TEMP/evidence/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-candidate-recheck
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
  baseline:
    needs: publish-test-fix
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-test-fix.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp Tests/SwiftUIWebViewTests/WebViewSnapshotFencingTests.swift "$RUNNER_TEMP/evidence/"
          git checkout --detach e1fb67b250e06f32a6b7ea82cbff71c1d4ca0d05
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
          cp "$RUNNER_TEMP/evidence/WebViewSnapshotFencingTests.swift" Tests/SwiftUIWebViewTests/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/SwiftUIWebView/SwiftUIWebView.swift')
          s=p.read_text(); old='private func makeWebViewSnapshotCapture('
          assert s.count(old)==1
          p.write_text(s.replace(old,'func makeWebViewSnapshotCapture('))
          PY
          # Visibility-only test seam above; all baseline runtime bodies remain unchanged.
          git diff > "$RUNNER_TEMP/evidence/baseline-visibility-only.patch"
          swift --version > "$RUNNER_TEMP/evidence/swift.txt"
          set +e
          swift test -j 4 --filter WebViewSnapshotFencingTests 2>&1 | tee "$RUNNER_TEMP/evidence/baseline.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > "$RUNNER_TEMP/evidence/exit-code.txt"
          test "$code" -ne 0
          grep -E 'Executed 16 tests, with [1-9][0-9]* failures' "$RUNNER_TEMP/evidence/baseline.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-baseline-recheck
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
