name: Temporary native receipt-binding qualification
on:
  pull_request:
    paths:
      - '.github/workflows/native-receipt-stage.yml'
permissions: {}
concurrency:
  group: native-receipt-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.event.pull_request.number == 17 && github.event.pull_request.head.repo.full_name == 'lake-of-fire/swiftui-webview' && github.event.pull_request.head.ref == 'fix/native-receipt-document-binding-20260926'
    runs-on: macos-26
    timeout-minutes: 30
    # Temporary: immutable source blobs only after exact-source qualification.
    # Does not update refs or merge; removed in the manual runtime commit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the exact reviewed three-file change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt-binding-stage"
          git merge-base --is-ancestor e0458e1ed8be67d672797b8103297c9dec308ab7 HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/receipt-binding-stage/checked-out-commit.txt"
          swift --version | tee "$RUNNER_TEMP/receipt-binding-stage/toolchain.txt"
          xcodebuild -version > "$RUNNER_TEMP/receipt-binding-stage/xcode.txt"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'receipt-binding-stage'
          blob = '59c7bd1f040a6ee087dc94e3ae79a6818e0ef6a9'
          request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/swiftui-webview/git/blobs/' + blob,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              value = json.load(response)
          assert value['encoding'] == 'base64'
          compressed = base64.b64decode(value['content'])
          assert len(compressed) == 3959
          assert hashlib.sha1(b'blob 3959\0' + compressed).hexdigest() == blob
          patch = gzip.decompress(compressed)
          assert len(patch) == 17537
          assert hashlib.sha256(patch).hexdigest() == 'ea35f27d78abebc4e48eed8a38265a92bb50f12e7a775b4d619052d63e2ed303'
          patch_path = evidence / 'reviewed.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', '--whitespace=error-all', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', str(patch_path)], check=True)
          # The first native compile found one test-only initializer label that
          # does not exist on the production JavaScript result type. Keep the
          # originally reviewed patch immutable and verify this exact correction.
          test_path = pathlib.Path('Tests/SwiftUIWebViewTests/WebViewReceiptDocumentBindingTests.swift')
          test_bytes = test_path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(test_bytes)).encode() + b'\0' + test_bytes).hexdigest() == '3dc55ac5e39ac81230d7797e5c411d642ea6b775'
          assert test_bytes.count(b'.init(value: nil)') == 1
          test_path.write_bytes(test_bytes.replace(b'.init(value: nil)', b'.init(nil)'))
          subprocess.run(['git', 'add', '--', str(test_path)], check=True)
          expected = {
              'Sources/SwiftUIWebView/SwiftUIWebView.swift': 'b5e33cce616e439ee520c3feaf6571e7b1bc26df',
              'Sources/SwiftUIWebView/WebViewMessageReceiptEvidence.swift': '8e0ea92fd7d33b75d56014c0d21cbb22215e12ec',
              'Tests/SwiftUIWebViewTests/WebViewReceiptDocumentBindingTests.swift': 'b4de225039c4306797b58321df75beb7e9f213d9',
          }
          files = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')[:-1]
          assert set(files) == set(expected)
          entries = []
          for path, sha in expected.items():
              data = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              assert subprocess.check_output(['git', 'ls-files', '--stage', '--', path]).decode().startswith('100644 ' + sha + ' 0\t')
              entries.append({'path': path, 'mode': '100644', 'sha': sha})
          (evidence / 'expected-blobs.json').write_text(json.dumps(entries, indent=2))
          subprocess.run(['tar', '-czf', str(evidence / 'patched-source.tar.gz'), *files], check=True)
          PY
      - name: Verify the regression catches late native-binding recapture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'receipt-binding-stage'
          source = pathlib.Path('Sources/SwiftUIWebView/SwiftUIWebView.swift')
          original = source.read_bytes()
          old = b'javaScriptBindingToken: receiptBindingToken,'
          assert original.count(old) == 2
          mutant = original.replace(old, b'javaScriptBindingToken: self.javaScriptBindingToken(for: sourceWebView),')
          names = ['testOrdinaryProviderReentryCannotRetargetTheMessageBinding', 'testBrokerProviderReentryCannotRetargetTheMessageBinding']
          try:
              source.write_bytes(mutant)
              result = subprocess.run(['swift', 'test', '-c', 'debug', '--disable-automatic-resolution', '--filter', '|'.join(names)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=600)
              (evidence / 'negative-control.log').write_text(result.stdout)
              print(result.stdout)
              assert result.returncode != 0, 'Late recapture must fail the real regression'
              assert 'XCTAssertEqual failed' in result.stdout, 'A compiler failure is not a red regression'
              for name in names:
                  assert any(name in line and "' failed" in line for line in result.stdout.splitlines()), name
          finally:
              source.write_bytes(original)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
      - name: Execute full native WebView package in Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          for configuration in debug release; do
            swift test -c "$configuration" --disable-automatic-resolution 2>&1 \
              | tee "$RUNNER_TEMP/receipt-binding-stage/test-$configuration.log"
          done
          git diff --exit-code
      - name: Store only verified immutable source blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'receipt-binding-stage'
          for configuration in ['debug', 'release']:
              log = (evidence / ('test-' + configuration + '.log')).read_text()
              passes = set(re.findall(r"Test Case '-\[(.*?)\]' passed", log))
              assert len(passes) >= 311, (configuration, len(passes))
              assert len([p for p in passes if 'WebViewReceiptDocumentBindingTests ' in p]) == 8
              assert not re.search(r"Test Case .*'(?: failed| skipped)", log)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          entries = json.loads((evidence / 'expected-blobs.json').read_text())
          assert len(entries) == 3
          output = []
          for entry in entries:
              path, sha = entry['path'], entry['sha']
              assert path in ['Sources/SwiftUIWebView/SwiftUIWebView.swift', 'Sources/SwiftUIWebView/WebViewMessageReceiptEvidence.swift', 'Tests/SwiftUIWebViewTests/WebViewReceiptDocumentBindingTests.swift']
              data = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              assert subprocess.check_output(['git', 'ls-files', '--stage', '--', path]).decode().startswith('100644 ' + sha + ' 0\t')
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/swiftui-webview/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              assert value['sha'] == sha
              output.append(entry)
          (evidence / 'published-blobs.json').write_text(json.dumps(output, indent=2))
          print('Verified native receipt blobs:', len(output))
          PY
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipt-binding-stage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt-binding-stage
          if-no-files-found: error
          retention-days: 7
